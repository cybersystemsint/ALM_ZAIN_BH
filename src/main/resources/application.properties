logging.config=classpath:logback-spring.xml

## -- Time Configuration
spring.jackson.time-zone=Africa/Nairobi
spring.datasource.hikari.data-source-properties.timeZone=Africa/Nairobi
# cause Jackson to write LocalDateTime as ISO-8601 strings, not numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

