# BARHAIN (updated to Oracle)
server.servlet.context-path = /alm-zain-jo/po-management

## -- Environment server IP (used in the JDBC URL)
env.server.ip=192.168.238.78

## -- DATABASE (Oracle) - using new credentials
spring.datasource.url=jdbc:oracle:thin:@//${env.server.ip}:1521/NEPDB
spring.datasource.username=ALMNEW
spring.datasource.password=ALM_NEW25
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.data.jdbc.repositories.enabled=false

# SQL logging
spring.jpa.show-sql=false
hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HikariCP settings for resource management (tuned for Oracle)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000

# Logging
# output to a temp_folder/file
LOG_PATH=/data/app/logs/alm/po-management
logging.config=classpath:logback-spring.xml

# Time configuration (choose the appropriate zone)
spring.jackson.time-zone=Asia/Riyadh
spring.datasource.hikari.data-source-properties.timeZone=Asia/Riyadh
# cause Jackson to write LocalDateTime as ISO-8601 strings, not numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# General logging levels
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO